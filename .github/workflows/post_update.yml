name: Crypto Market Update

on:
  schedule:
    - cron: '10 */4 * * *'     # silent confirmed-4h scan; max two event alerts/day
    - cron: '15 4 * * *'       # morning market map (~06:15 Rome in summer) — 8h before macro close
    - cron: '15 8 * * *'       # daily derivatives pulse (~10:15 Rome) — funding/long-short/trending
    - cron: '15 12 * * *'      # rotating two-asset deep dive (~14:15 Rome) — 8h after market map, 8h before macro close
    - cron: '15 16 * * 0'      # Sunday weekly digest (~18:15 Rome) — fills the weekend gap
    - cron: '15 16 * * 6'      # Saturday signal scorecard (~18:15 Rome) — hypothetical track record
    - cron: '15 6 * * 1'       # Monday what-to-watch (~08:15 Rome) — forward-looking week ahead
    - cron: '15 20 * * 1-5'    # 16:15 New York while US daylight time is active
    - cron: '15 21 * * 1-5'    # 16:15 New York during US standard time
  workflow_dispatch:
    inputs:
      mode:
        description: Content slot to publish
        type: choice
        required: true
        default: all
        options:
          - all
          - market_map
          - deep_dive
          - macro_close
          - alerts
          - daily_pulse
          - weekly_digest
          - signal_scorecard
          - what_to_watch
      force:
        description: Republish even if today's slot is already recorded
        type: boolean
        required: false
        default: false

permissions:
  contents: write   # needed so the "Commit updated state" step can push post_history.json

concurrency:
  group: crypto-market-publisher
  cancel-in-progress: false

jobs:
  post-update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Test pipeline
        run: python -m unittest discover -s tests -v

      - name: Run pipeline
        env:
          DEEPSEEK_KEY: ${{ secrets.DEEPSEEK_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
          TELEGRAM_CHANNEL_FA: ${{ secrets.TELEGRAM_CHANNEL_FA }}
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
          POST_MODE: ${{ github.event.inputs.mode || 'auto' }}
          CRON_SCHEDULE: ${{ github.event.schedule }}
          FORCE_FLAG: ${{ github.event.inputs.force == 'true' && '--force' || '' }}
        run: python main.py --mode "${POST_MODE}" ${FORCE_FLAG}

      - name: Commit updated state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add post_history.json posts_log.jsonl
          if git diff --staged --quiet; then
            echo "No state changes"
            exit 0
          fi
          git commit -m "Update post history [skip ci]"

          # Bunched-up schedule triggers can run back-to-back (same concurrency
          # group, so serialized), but actions/checkout pins the ref to the SHA
          # at trigger time, not the branch tip at run time — so a run queued
          # behind another one can still start from a stale checkout and get
          # its push rejected. Rebase onto the latest tip and retry; on a real
          # conflict in this generated state file, our freshly-written version
          # wins since it reflects this run's own result.
          for attempt in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "Push rejected (attempt $attempt), rebasing onto latest main..."
            git fetch origin main
            if ! git rebase origin/main; then
              git checkout --ours -- post_history.json posts_log.jsonl
              git add post_history.json posts_log.jsonl
              git rebase --continue
            fi
            sleep $((RANDOM % 6 + 2))
          done
          echo "Failed to push after retries" >&2
          exit 1
