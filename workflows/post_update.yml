name: Crypto Market Update

on:
  schedule:
    - cron: '10 */4 * * *'   # every 4 hours, 10 min past the hour
  workflow_dispatch: {}       # lets you trigger a run manually from the Actions tab

jobs:
  post-update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pipeline
        env:
          DEEPSEEK_KEY: ${{ secrets.DEEPSEEK_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
        run: python main.py

      - name: Commit updated state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add post_history.json
          git diff --staged --quiet && echo "No state changes" || git commit -m "Update post history [skip ci]"
          git push
